bilateral_note: PPL1 DANs send axons bilaterally to the same compartments (Li et al. 2020); their M columns
  split equally across both sides.
unplaced_dan_types:
- hemibrain_type: PPL107
  reason: No MB lobe innervation; SMP/CRE/SIP (FlyWire cell-type explorer).
- hemibrain_type: PPL108
  reason: No MB lobe innervation; SMP/CRE/SIP (FlyWire cell-type explorer).
- hemibrain_type: PPL201
  reason: Innervates the calyx, LH and SLP, not the lobes (Mao and Davis 2009); no calyx compartment in
    Phase 1.
- hemibrain_type: PPL202
  reason: PPL2ab cluster; calyx/LH/protocerebrum or lobula/protocerebrum, no MB lobe compartments (Mao
    and Davis 2009).
- hemibrain_type: PPL203
  reason: PPL2ab cluster; calyx/LH/protocerebrum or lobula/protocerebrum, no MB lobe compartments (Mao
    and Davis 2009).
- hemibrain_type: PPL204
  reason: PPL2ab cluster; calyx/LH/protocerebrum or lobula/protocerebrum, no MB lobe compartments (Mao
    and Davis 2009).
- hemibrain_type: CB2730
  reason: cell_class DAN with no hemibrain_type; the Aso 2014 table cannot place it.
pedc_note: PAM09 (beta1-ped), PPL101 (gamma1pedc) and MBON11 (gamma1pedc) also arborize in the peduncle
  core, which is not a Phase 1 compartment; their M/W weights go fully to the named lobe compartment.
kc_lobe_note: Gamma KCs spread over gamma1-gamma5; alpha/beta KCs over alpha1-alpha3 and beta1-beta2;
  alpha-prime/beta-prime KCs over their five.
