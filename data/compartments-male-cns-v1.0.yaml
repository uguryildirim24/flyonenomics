mbon_notes: Dendritic compartment only; the axonal '>...' suffix is not exposure. Sub-slice suffixes (a/m/p/d/sp) collapse
  to the Phase 1 compartment. MBON22-calyx has no Phase 1 compartment and keeps a zero W row. MBON11 also arborizes in the
  peduncle core (pedc), which is not a Phase 1 compartment; its weight goes fully to gamma1.
