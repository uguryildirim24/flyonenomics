<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Four input histories</title>
<style>
:root{--ink:#15283a;--muted:#566a7b;--rule:#dfe6eb;--accent:#0f5f7a;--cx:#b8336a;--font:"Helvetica Neue",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font:17px/1.4 var(--font);-webkit-font-smoothing:antialiased}
#figure{width:1800px;padding:40px 48px 30px;background:#fff}
.kicker{font-size:14px;font-weight:700;letter-spacing:3px;color:var(--accent);text-transform:uppercase}
h1{font-size:42px;line-height:1.1;margin:8px 0 8px;letter-spacing:-.6px}
.sub{font-size:20px;color:var(--muted);max-width:1500px}
.honest{margin:18px 0 26px;padding:11px 16px;border-left:4px solid var(--accent);background:#eaf2f5;font-size:18px;color:#1f3d4f}
.honest b{font-weight:700}
.grid{display:grid;grid-template-columns:170px 1fr 1fr;column-gap:26px;row-gap:22px}
.col{font-size:24px;font-weight:700;padding-bottom:9px;border-bottom:6px solid var(--c);align-self:end}
.col span{display:block;font-size:17px;font-weight:400;color:var(--muted);margin-top:2px}
.row{align-self:center;font-size:23px;font-weight:700;line-height:1.2}
.row span{display:block;font-size:17px;font-weight:400;color:var(--muted);margin-top:4px}
.panel{position:relative}
.panel img{display:block;width:100%;height:auto;border-radius:4px;border-top:6px solid var(--c)}
.letter{position:absolute;left:16px;top:16px;font-size:34px;font-weight:700;color:#fff;line-height:1}
.when{position:absolute;right:16px;top:20px;font-size:18px;font-weight:600;color:#e8eef3;font-variant-numeric:tabular-nums}
.scale{position:absolute;left:18px;bottom:16px;color:#e8eef3;font-size:15px}
.scale i{display:block;height:3px;background:#e8eef3;margin-top:5px}
.agg{margin-top:9px;font-size:18px;color:var(--cx);font-weight:700;font-variant-numeric:tabular-nums}
.agg span{color:var(--muted);font-weight:400}
.keys{display:grid;grid-template-columns:600px 1fr;column-gap:56px;margin:28px 0 0 196px;padding-top:22px;border-top:1px solid var(--rule)}
.keys h2{font-size:19px;margin:0 0 12px}
.bar{display:flex;border-radius:3px;overflow:hidden;height:30px;border:2px solid #0b1017}
.bar i{flex:1}
.ticks{display:flex;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.ticks span{flex:1;text-align:center;padding-top:4px}
.ends{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);margin-top:2px}
.note{font-size:15px;color:var(--muted);margin-top:8px}
.item{display:flex;gap:12px;align-items:flex-start;font-size:17px;margin-bottom:12px}
.swatch{flex:none;width:44px;height:22px;border-radius:3px;margin-top:1px}
.foot{margin:26px 0 0;padding-top:12px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted);display:flex;justify-content:space-between;gap:30px}
</style>
</head>
<body>
<div id="figure">
 <div class="kicker" id="kicker"></div>
 <h1 id="title"></h1>
 <div class="sub" id="sub"></div>
 <div class="honest" id="honest"></div>
 <div class="grid" id="grid"></div>
 <div class="keys">
  <div>
   <h2 id="scale-title"></h2>
   <div class="bar" id="bar"></div>
   <div class="ticks" id="ticks"></div>
   <div class="ends"><span id="low"></span><span id="high"></span></div>
   <div class="note" id="scale-note"></div>
  </div>
  <div>
   <h2>What the colours show</h2>
   <div class="item"><i class="swatch" id="recorded-swatch"></i><span id="recorded"></span></div>
   <div class="item"><i class="swatch" id="grey-swatch"></i><span id="grey"></span></div>
   <div class="item"><i class="swatch" style="background:var(--cx);height:4px;margin-top:10px"></i><span id="aggregate"></span></div>
  </div>
 </div>
 <div class="foot"><span id="attribution"></span><span id="orient"></span></div>
</div>
<script>
const d=__DATA__;
const byId=id=>document.getElementById(id);
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e;};
byId('kicker').textContent=d.kicker;byId('title').textContent=d.title;byId('sub').textContent=d.subtitle;
d.honest.forEach((line,i)=>{const s=el(i?'span':'b',null,line);byId('honest').append(s,' ');});
const grid=byId('grid');grid.append(el('div'));
for(const c of d.columns){const h=el('div','col',c.title);h.style.setProperty('--c',c.colour);h.append(el('span',null,c.detail));grid.append(h);}
d.rows.forEach((r,i)=>{const h=el('div','row',r.title);h.append(el('span',null,r.detail));grid.append(h);
 for(const p of d.panels.slice(2*i,2*i+2)){const box=el('div');const panel=el('div','panel');panel.style.setProperty('--c',p.colour);
  const img=el('img');img.src=p.src;img.alt=`${p.title}, ${p.detail}, ${p.when}`;panel.append(img,el('div','letter',p.letter),el('div','when',p.when));
  if(p.scale_fraction){const s=el('div','scale','100 µm');const bar=el('i');bar.style.width=`calc(${p.scale_fraction} * var(--w))`;s.append(bar);panel.append(s);}
  const agg=el('div','agg',`${p.aggregate} spikes/s `);agg.append(el('span',null,d.aggregate_label));box.append(panel,agg);grid.append(box);}});
const s=d.scale;byId('scale-title').textContent=s.title;
for(const c of d.levels){const i=el('i');i.style.background=c;byId('bar').append(i);}
for(const v of s.level_labels)byId('ticks').append(el('span',null,v));
byId('low').textContent=s.low;byId('high').textContent=s.high;byId('scale-note').textContent=s.note;
byId('recorded-swatch').style.background=`linear-gradient(90deg,${d.levels.join(',')})`;byId('recorded').textContent=d.recorded;
byId('grey-swatch').style.background=`#0b1017 linear-gradient(${d.grey.color},${d.grey.color}) center/100% 4px no-repeat`;byId('grey').textContent=d.grey.text;
byId('aggregate').textContent=d.aggregate_text;byId('attribution').textContent=d.attribution;byId('orient').textContent=d.orient;
// The scale bar is a fraction of the rendered panel width, so it stays true at any figure size.
for(const p of document.querySelectorAll('.panel'))p.style.setProperty('--w',p.clientWidth+'px');
window.panelsReady=Promise.all([...document.images].map(i=>i.decode())).then(()=>document.fonts.ready).then(()=>true);
</script>
</body>
</html>
