[project]
name = "flyonenomics"
version = "0.1.0"
description = "Male fly CNS spiking model for dopamine perturbation research; no validated behaviour."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
  "brian2==2.10.1",
  "cython==3.1.3",
  "numpy==2.5.3",
  "scipy==1.16.2",
  "pandas==3.0.5",
  "pyarrow==25.0.1",
  "pydantic==2.12.4",
  "pyyaml==6.0.3",
  "mcp==1.20.0",
  "fastapi==0.119.0",
  "uvicorn==0.37.0",
  "websockets==16.0",
]

[dependency-groups]
dev = ["pytest==8.4.2", "hypothesis==6.140.0"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flyonenomics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: isolated engine groups and whole-brain orchestrator or MCP runs"]

[project.scripts]
flyonenomics-mcp = "flyonenomics.server.mcp_server:main"
flyonenomics-dash = "flyonenomics.dashboard.app:main"
